name: public-authority-assistant

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authority
      POSTGRES_PASSWORD: authority
      POSTGRES_DB: authority
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authority -d authority"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      BIND_ADDR: "0.0.0.0:8080"
      DATABASE_URL: "postgres://authority:authority@postgres:5432/authority"
      REDIS_URL: "redis://redis:6379"
      RATE_LIMIT_PER_MINUTE: "120"
      CORS_ALLOW_ORIGIN: "*"
      STRICT_READINESS: "true"
      RUST_LOG: "info,tower_http=debug,public_authority_api=debug"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
